name: Резервная копия данных из базы

# Читает данные сайта из базы и складывает в data/live.json.
#
# ЗАЧЕМ. После переезда история сервера живёт в базе, а не в репозитории.
# База удобнее, но у неё нет главного свойства git: неудаляемой истории правок
# и тысячи копий по чужим машинам. Бесплатный проект можно потерять, тариф —
# изменить, а неудачный запрос из SQL-редактора стирает данные молча.
#
# Поэтому каждые два часа данные возвращаются в репозиторий. Потерять можно
# максимум два часа правок, а не всё.
#
# Заодно это рабочий путь назад: файл лежит в формате, который читает
# json-адаптер, — возврат к прежнему устройству это одна строка в config.js.
#
# С 01.10.2026 у файла появился второй читатель, и он важнее резерва. Когда
# база недоступна тому, кто зашёл без VPN (адрес *.supabase.co отдаёт
# Cloudflare, и российские сети режут его точечно), сайт показывает этот
# снимок и говорит об этом вслух — см. loadAll() в src/data/index.js.
# Суточная копия на эту роль не годилась: «рейтинг вчерашнего вечера» под
# видом сегодняшнего был бы не запасом, а обманом.

on:
  schedule:
    # Каждые два часа в :05. Интервал выбран не ради свежести — данные вносят
    # руками после каждого VS, — а ради того, чтобы снимок годился в запас:
    # копия суточной давности уже не «данные на сейчас», а вчерашний день.
    # :05, а не :00 — тот же приём, что в store-feed.yml: в ровные минуты
    # очередь планировщика GitHub длиннее, и слот легче пропускается.
    - cron: '5 */2 * * *'
  # Ручной запуск: перед рискованной правкой или после неё.
  workflow_dispatch:

# Два одновременных запуска мешали бы друг другу при коммите.
concurrency:
  group: backup-from-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Секретов здесь нет намеренно: адрес и публичный ключ лежат в config.js,
      # а данные сайта открыты на чтение всем — это открытый сайт сообщества.
      # Служебному ключу в воркфлоу делать нечего.
      - name: Прочитать базу и обновить data/live.json
        run: node scripts/backup-from-db.mjs

      - name: Закоммитить, если данные изменились
        run: |
          if git diff --quiet -- data/live.json; then
            echo "Изменений нет, коммит не нужен."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "резервная копия базы: $(date -u '+%d.%m.%Y %H:%M UTC')"
          git push

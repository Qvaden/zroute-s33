# Имя без двоеточия внутри. «Фид магазина: обновления и события» YAML прочесть
# не может: значение с «: » посередине он считает началом новой пары, и весь
# файл становится невалидным. GitHub при этом не говорит ни слова про имя —
# он заводит прогон с нулём задач и красной надписью, а в списке показывает
# путь файла вместо имени. Первый же боевой прогон так и упал.
name: Фид магазина — обновления и события

# Читает Google Play и App Store и приносит из них в базу то же, что
# модератор вводит руками: заметку об обновлении и события игры.
#
# ЗАЧЕМ ИМЕННО ЗДЕСЬ. Страница посетителя наружу не ходит: браузер не пустит
# запрос к чужому сайту с нашего домена, а пусти — чужой текст попал бы на сайт
# без всякой проверки. Поэтому читает магазины отдельная задача на GitHub, а
# сайт только показывает то, что уже лежит в базе.
#
# КЕМ ПИШЕТ. Обычным входом по нику и паролю бота — как любой игрок. Служебный
# ключ, обходящий правила доступа, в проекте не появляется: права бота ровно
# те, которые ему выдала модерация, и отзываются тем же списком игроков. Без
# учётных данных запуск остаётся сухим: он печатает найденное и не трогает
# базу, поэтому включение автомата — это один заведённый секрет, а не правка
# кода.
#
# КОГДА ПУБЛИЧНО. Пост появляется в списке сразу, без очереди на проверку:
# так договорились. Отсюда два правила. Первое — в пост не попадает ничего,
# чего магазин сам не назвал: ни догадок про содержание, ни нашей даты «за
# сегодня». Второе — молчание магазина не есть новость для игрока: площадка,
# которая не назвала ни версии, ни текста, из поста исключается, а её отсутствие
# видит модерация в состоянии обхода на той же вкладке.

on:
  schedule:
    # Каждый час в :17. Редкое расписание оказалось хуже частого: три слота в
    # сутки — это три шанса, и пропуск одного отодвигает пост на восемь часов.
    # Так и вышло 30 сентября: слот 04:15 UTC GitHub не отдал вовсе, хотя файл
    # планировщика был прочитан (тот же аккаунт в этот день крутил резервную
    # копию базы, то есть очередь планировщика жила). Часовая проверка залечивает
    # пропуск сама: следующий запуск через час, а повторный пост автомату не
    # грозит — примечание к блоку concurrency ниже объясняет, почему.
    # Минуту взяли не круглую: на нуле и на полчаса очередь запусков длиннее,
    # и GitHub сдвигает задачу на десятки минут.
    - cron: '17 * * * *'
  # Ручной запуск: проверить разбор после смены вёрстки или сразу после
  # первой миграции фида.
  workflow_dispatch:
    inputs:
      dry:
        description: 'сухой: только показать найденное, в базу не писать'
        type: boolean
        default: false

# Два одновременных запуска написали бы одну и ту же заметку дважды: база
# такие дубли ловит, но лишний запрос и лишняя оговорка в состоянии никому не
# нужны. Отменяющего запуска нет: оборотить запись посреди пути нельзя.
concurrency:
  group: store-feed
  cancel-in-progress: false

# Права ровно на чтение репозитория: воркфлоу ничего в нём не меняет, все его
# правки уходят в базу.
permissions:
  contents: read

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Зависимостей у проекта нет: скрипт живёт на одном Node. Адрес и
      # публичный ключ он берёт из config.js, а приватного ключа в репозитории
      # не было и нет.
      - name: Прочитать магазины и принести в базу
        env:
          STORE_FEED_NICK: ${{ secrets.STORE_FEED_NICK }}
          STORE_FEED_PASSWORD: ${{ secrets.STORE_FEED_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then
            echo "Запуск вручную с флажком «сухой»: база не тронута."
            node scripts/store-feed.mjs
          elif [ -z "$STORE_FEED_NICK" ] || [ -z "$STORE_FEED_PASSWORD" ]; then
            echo "Секретов бота нет — запуск сухой, в базу не пишем."
            node scripts/store-feed.mjs
          else
            node scripts/store-feed.mjs --писать
          fi

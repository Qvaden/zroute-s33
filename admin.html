<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Панель · Сервер 33</title>

  <!--
    Панель не должна попадать в поиск: она бесполезна без токена, а в выдаче
    рядом с сайтом сообщества выглядела бы приглашением подёргать ручки.
  -->
  <meta name="robots" content="noindex, nofollow">

  <!--
    Ни манифеста, ни service worker'а здесь намеренно нет.
    Панель обязана всегда показывать свежие данные: закэшированная админка,
    показывающая прошлую неделю, — это способ опубликовать чужую правку
    поверх своей, ничего не заметив.
  -->
  <link rel="icon" type="image/svg+xml" href="./public/icons/icon-32.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!--
    Сначала язык сайта: токены, типографика, панели. Потом только своё.

    Здесь стоял src/styles.css — файл, который сам сайт не грузит с версии v6.
    Панель при этом выглядела почти правильно: базовые цвета и радиусы в обоих
    файлах совпадают. Но admin.css ссылается на --ease-out и --electric,
    которых в старом файле нет вовсе, и часть оформления молча не работала:
    подсветка президентской доски, плавность кнопок.

    Правило простое: панель переиспользует ТОТ ЖЕ язык, что и сайт. Иначе
    расхождение накапливается незаметно — оба файла живые, ошибки нет,
    а выглядит по-разному.
  -->
  <link rel="stylesheet" href="./src/styles-v8.css?v=1">
  <link rel="stylesheet" href="./src/admin/admin.css?v=10">
  <!--
    Телефон — последним слоем перед элементами ввода.

    Итоги VS вносят вечером после боя, и делают это с телефона: компьютер
    в этот момент не у всех под рукой. Тридцать две отметки пальцем по мелким
    кнопкам это работа, а не удобство.
  -->
  <link rel="stylesheet" href="./src/admin/admin-mobile.css?v=2">
  <!--
    Элементы ввода — общие с сайтом. Списки, флажки и поля даты в панели
    выглядели системными: белый прямоугольник среди тёмных панелей.
    Правила для select до этого лежали в четырёх местах admin.css и спорили
    друг с другом; теперь они в одном файле на оба входа.
  -->
  <link rel="stylesheet" href="./src/controls.css?v=1">
  <link rel="stylesheet" href="./src/refine.css?v=4">
</head>
<body class="adm">
  <div id="admin"><div class="loading">Загружаем панель…</div></div>
  <script type="module" src="./src/admin/main.js?v=16"></script>
</body>
</html>

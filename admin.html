<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель · Сервер 33</title>

  <!--
    Панель не должна попадать в поиск: она бесполезна без токена, а в выдаче
    рядом с сайтом сообщества выглядела бы приглашением подёргать ручки.
  -->
  <meta name="robots" content="noindex, nofollow">

  <!--
    Ни манифеста, ни service worker'а здесь намеренно нет.
    Панель обязана всегда показывать свежие данные: закэшированная админка,
    показывающая прошлую неделю, — это способ опубликовать чужую правку
    поверх своей, ничего не заметив.
  -->
  <link rel="icon" type="image/svg+xml" href="./public/icons/icon-32.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Сначала язык сайта: токены, типографика, панели. Потом только своё. -->
  <link rel="stylesheet" href="./src/styles.css?v=5">
  <link rel="stylesheet" href="./src/admin/admin.css?v=2">
</head>
<body class="adm">
  <div id="admin"><div class="loading">Загружаем панель…</div></div>
  <script type="module" src="./src/admin/main.js?v=2"></script>
</body>
</html>

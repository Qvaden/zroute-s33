<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Сервер 33 · Z Route: Redemption</title>
  <meta name="description" content="Форум сообщества 33 сервера Z Route: Redemption. Хроника захватов, рейтинг альянсов по итогам VS и разбор для малых альянсов.">

  <!-- Установка на телефон -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Сервер 33">
  <link rel="icon" type="image/svg+xml" href="./public/icons/icon-32.svg">
  <!--
    iOS не принимает SVG в apple-touch-icon, поэтому здесь нужен именно PNG.
    Файл лежит в public/icons/, но в репозиторий его нужно загрузить вручную:
    интеграция с GitHub портит бинарные файлы. Подробности в README.
    Пока файла нет, iOS просто возьмёт скриншот страницы — не идеально,
    но ничего не ломает.
  -->
  <link rel="apple-touch-icon" href="./public/icons/icon-180.png">

  <!--
    Превью ссылки. Сайт будут кидать в чаты сообщества, и там показывается
    именно это: картинка, заголовок и описание вместо голого адреса.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Сервер 33 · Z Route: Redemption">
  <meta property="og:title" content="Сервер 33 — рейтинг альянсов по итогам VS">
  <meta property="og:description" content="Победа +1, поражение −1. Видно, у кого из алов получается побеждать, а у кого нет.">
  <!--
    og:image обязан быть АБСОЛЮТНЫМ адресом. Относительный путь работает
    в браузере, но сборщики превью в мессенджерах его не разворачивают —
    ссылка в чате осталась бы без картинки.

    Это единственное место во всём проекте с зашитым адресом сайта.
    При переезде на другой хостинг строку ниже нужно поправить, всё остальное
    относительное и переедет само. За абсолютностью следит тест
    «I. Готовность к публикации».
  -->
  <meta property="og:url" content="https://qvaden.github.io/zroute-s33/">
  <meta property="og:image" content="https://qvaden.github.io/zroute-s33/public/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Сервер 33 — рейтинг альянсов по итогам VS">
  <meta property="og:locale" content="ru_RU">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" crossorigin href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Inter:wght@400;500;600;700&display=optional" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet"></noscript>

  <link rel="stylesheet" href="./src/styles-v8.css">
  <!--
    Форум и боковые вкладки — отдельным файлом.

    styles-v8.css уже перевалил за сотню килобайт и дописан слоями поверх
    прошлых версий. Складывать туда ещё и форум значит сделать его
    окончательно неразбираемым: у форума своя, независимая от рейтинга
    и хронологии, задача, и его правки не должны задевать таблицы.
  -->
  <link rel="stylesheet" href="./src/forum.css?v=2">
  <!--
    Телефон — последним слоем.

    Порядок здесь работает как приоритет: правила ниже перебивают правила выше
    при равной силе. Аудитория заходит с телефона, поэтому поправки для узкого
    экрана обязаны быть последним словом, а не спорить со слоями,
    накопившимися в styles-v8.css за шесть версий.
  -->
  <link rel="stylesheet" href="./src/mobile.css?v=2">
  <script>
    try {
      if (localStorage.getItem('s33-loader-seen') === '1') {
        document.documentElement.classList.add('s33-loader-seen');
      }
    } catch (_) {}
  </script>
</head>
<body>
  <div id="boot-loader" class="boot-loader" role="status" aria-live="polite" aria-label="Загрузка Server 33">
    <div class="boot-loader__core">
      <div class="boot-loader__mark"><span>33</span></div>
      <div class="boot-loader__brand">
        <strong>СЕРВЕР 33</strong>
        <small>Z ROUTE: REDEMPTION</small>
      </div>
      <div class="boot-loader__signal"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="boot-loader__status"><span>ИНИЦИАЛИЗАЦИЯ СЕРВЕРА</span><b>ONLINE</b></div>
    </div>
  </div>
  <header class="site-head">
    <div class="site-head__inner">
      <!--
        Кнопка меню. На широком экране вкладки стоят слева постоянно,
        и кнопка не нужна — она скрыта стилями, а не убрана из разметки:
        размер экрана меняется поворотом телефона, и решать это должен CSS.

        Слово «Меню» рядом с полосками стоит намеренно. Три полоски узнаёт
        не каждый, а на тёмной шапке рядом с яркой маркой они читались как
        часть фона: человек не понимал, где остальные разделы, и решал,
        что их нет.
      -->
      <button type="button" id="side-toggle" class="burger"
              aria-controls="side" aria-expanded="false" aria-label="Открыть меню разделов">
        <span class="burger__lines" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <span class="burger__label">Меню</span>
      </button>

      <a class="brand brand--head" href="#/forum">
        <span class="brand__num">33</span>
        <span class="brand__text">
          <b>Сервер 33</b>
          <small>Z Route: Redemption</small>
        </span>
      </a>

      <div id="president-board" class="president-board" hidden></div>
    </div>
  </header>

  <!--
    БОКОВЫЕ ВКЛАДКИ.

    Раньше разделы стояли строкой в шапке и уже не помещались: на телефоне
    строка прокручивалась, и последние вкладки не было видно вовсе — человек
    не знал, что они есть. Слева места хватает на любое их число, и каждая
    подписана словом, а не обрезана.

    На узком экране панель уезжает за левый край и выдвигается кнопкой:
    отдавать треть экрана телефона под меню нельзя.
  -->
  <aside id="side" class="side" aria-label="Разделы сайта">
    <a class="brand brand--side" href="#/forum">
      <span class="brand__num">33</span>
      <span class="brand__text">
        <b>Сервер 33</b>
        <small>Z Route: Redemption</small>
      </span>
    </a>

    <nav id="nav" class="nav"></nav>

    <div class="side__foot">
      <span class="side__note">Неофициальный сайт сообщества</span>
    </div>
  </aside>

  <!-- Затемнение под выдвинутой панелью: нажатие мимо меню его закрывает. -->
  <div class="side-veil" id="side-veil" hidden></div>

  <main id="app" class="wrap"></main>

  <footer class="site-foot wrap">
    <p>
      Неофициальный сайт сообщества 33 сервера. Данные вносятся вручную после каждого VS.
      Источник данных: <b id="source-badge">—</b>.
    </p>
  </footer>

  <script type="module" src="./src/main.js?v=13"></script>

  <script>
    /*
      Регистрация service worker'а — только ради установки на телефон
      и работы без связи. Адрес относительный: сайт может лежать
      в подпапке (например qvaden.github.io/zroute-s33/), и абсолютный
      путь тогда бы указал в корень домена.

      Ошибку глотаем осознанно: без service worker'а сайт полностью
      работоспособен, и ронять из-за него страницу незачем.
    */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <!--
    Счётчик посещений — GoatCounter. Выбран за то же, что и весь проект:
    ничего не стоит, не ставит cookies и не требует согласия на слежку,
    а без него легко жить, если он однажды пропадёт — see-then-forget код,
    не завязанная на него часть сайта.

    Первый показ страницы GoatCounter считает сам, при загрузке этого
    скрипта. Переходы между разделами (#/ladder, #/timeline…) происходят
    без перезагрузки страницы, поэтому их досчитывает src/main.js —
    см. функцию trackPageview там.
  -->
  <script data-goatcounter="https://qvaden.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>

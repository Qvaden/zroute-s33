<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Сервер 33 · Z Route: Redemption</title>
  <meta name="description" content="Рейтинг альянсов 33 сервера по итогам VS: кто побеждает, а кто нет. Хронология захвата серверов и разбор для малых альянсов.">

  <!-- Установка на телефон -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Сервер 33">
  <link rel="icon" type="image/svg+xml" href="./public/icons/icon-32.svg">
  <!--
    iOS не принимает SVG в apple-touch-icon, поэтому здесь нужен именно PNG.
    Файл лежит в public/icons/, но в репозиторий его нужно загрузить вручную:
    интеграция с GitHub портит бинарные файлы. Подробности в README.
    Пока файла нет, iOS просто возьмёт скриншот страницы — не идеально,
    но ничего не ломает.
  -->
  <link rel="apple-touch-icon" href="./public/icons/icon-180.png">

  <!--
    Превью ссылки. Сайт будут кидать в чаты сообщества, и там показывается
    именно это: картинка, заголовок и описание вместо голого адреса.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Сервер 33 · Z Route: Redemption">
  <meta property="og:title" content="Сервер 33 — рейтинг альянсов по итогам VS">
  <meta property="og:description" content="Победа +1, поражение −1. Видно, у кого из алов получается побеждать, а у кого нет.">
  <!--
    og:image обязан быть АБСОЛЮТНЫМ адресом. Относительный путь работает
    в браузере, но сборщики превью в мессенджерах его не разворачивают —
    ссылка в чате осталась бы без картинки.

    Это единственное место во всём проекте с зашитым адресом сайта.
    При переезде на другой хостинг строку ниже нужно поправить, всё остальное
    относительное и переедет само. За абсолютностью следит тест
    «I. Готовность к публикации».
  -->
  <meta property="og:url" content="https://qvaden.github.io/zroute-s33/">
  <meta property="og:image" content="https://qvaden.github.io/zroute-s33/public/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Сервер 33 — рейтинг альянсов по итогам VS">
  <meta property="og:locale" content="ru_RU">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <header class="site-head">
    <div class="site-head__inner">
      <a class="brand" href="#/home">
        <span class="brand__num">33</span>
        <span class="brand__text">
          <b>Сервер 33</b>
          <small>Z Route: Redemption</small>
        </span>
      </a>
      <nav id="nav" class="nav"></nav>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <footer class="site-foot wrap">
    <p>
      Неофициальный сайт сообщества 33 сервера. Данные вносятся вручную после каждого VS.
      Источник данных: <b id="source-badge">—</b>.
    </p>
  </footer>

  <script type="module" src="./src/main.js?v=2"></script>

  <script>
    /*
      Регистрация service worker'а — только ради установки на телефон
      и работы без связи. Адрес относительный: сайт может лежать
      в подпапке (например qvaden.github.io/zroute-s33/), и абсолютный
      путь тогда бы указал в корень домена.

      Ошибку глотаем осознанно: без service worker'а сайт полностью
      работоспособен, и ронять из-за него страницу незачем.
    */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <!--
    Счётчик посещений — GoatCounter. Выбран за то же, что и весь проект:
    ничего не стоит, не ставит cookies и не требует согласия на слежку,
    а без него легко жить, если он однажды пропадёт — see-then-forget код,
    не завязанная на него часть сайта.

    Первый показ страницы GoatCounter считает сам, при загрузке этого
    скрипта. Переходы между разделами (#/ladder, #/timeline…) происходят
    без перезагрузки страницы, поэтому их досчитывает src/main.js —
    см. функцию trackPageview там.
  -->
  <script data-goatcounter="https://qvaden.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>

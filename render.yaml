# Раздача сайта. Файл появился после того, как Netlify заморозил прод:
# месячные кредиты команды кончились, и два пуша получили статус Skipped,
# то есть push в main перестал означать «изменение на сайте». Подробности и
# история — docs/HOSTING.md.
#
# Render читает этот файл при создании сервиса через New → Blueprint, поэтому
# настройки живут здесь, а не в интерфейсе: их нельзя потерять при пересоздании
# проекта и нельзя незаметно поправить руками.
#
# Сборки нет: обычные ES-модули, зависимостей в проекте нет (package.json без
# dependencies). buildCommand — намеренный пустой шаг, иначе Render по наличию
# package.json попытался бы запустить установку.

services:
  - type: web
    name: zroutehub
    runtime: static
    buildCommand: 'true'
    # Публикуется корень репозитория: index.html и admin.html лежат в нём,
    # а не в собранном каталоге.
    staticPublishPath: ./
    headers:
      # Сервис-воркер не кэшируем: ?v= из ссылок на него не работает,
      # воркер перечитывается сам, и залипшая копия означает, что часть
      # игроков останется на прошлой версии неопределённо долго.
      - path: /sw.js
        name: Cache-Control
        value: 'no-cache, no-store, must-revalidate'

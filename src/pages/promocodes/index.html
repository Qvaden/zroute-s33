<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Промокоды для Z Route: Redemption</title>
  <meta name="description" content="Актуальные промокоды для сервера 33 Z Route: Redemption. Проверяем работоспособность и обновляем список регулярно.">
  <link rel="stylesheet" href="../styles-v8.css?v=30">
  <link rel="stylesheet" href="../forum.css?v=69">
  <link rel="stylesheet" href="../mobile.css?v=50">
  <link rel="stylesheet" href="../controls.css?v=13">
  <link rel="stylesheet" href="../refine.css?v=58">
  <link rel="stylesheet" href="../promocodes.css?v=1">
  <script>
    document.documentElement.setAttribute('data-route', 'promocodes');
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\'/g, '&apos;')
        .replace(/\"/g, '&quot;');
    }
  </script>
</head>
<body>
  <header class="page-header">
    <div class="page-header__inner">
      <h1>Промокоды</h1>
      <nav class="page-header__nav">
        <a href="#/home" class="page-header__link">Главная</a>
        <a href="#/ladder" class="page-header__link">Рейтинг</a>
        <a href="#/forum" class="page-header__link">Форум</a>
        <a href="#/promocodes" class="page-header__link is-active">Промокоды</a>
        <a href="#/chats" class="page-header__link">Чаты</a>
        <a href="#/about" class="page-header__link">О проекте</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <section class="panel">
      <header class="panel__head">
        <h2>Актуальные промокоды</h2>
        <p class="muted">Список обновляется регулярно. Промокоды проверяются на работоспособность.</p>
      </header>
      <div class="promocodes-list" id="promocodes-list">
        <!-- Список промокодов будет загружен здесь -->
      </div>
    </section>
  </main>

  <script>
    // Загрузка промокодов из JSON
    fetch('/promocodes.json')
      .then(response => response.json())
      .then(data => {
        const promocodes = data;
        const container = document.getElementById('promocodes-list');
        if (!container) return;

        container.innerHTML = promocodes.map(promocode => {
          const statusClass = promocode.status === 'active' ? 'active' : 'inactive';
          return `
            <div class="promocode-card">
              <div class="promocode-code">${esc(promocode.code)}</div>
              <div class="promocode-status">
                <span class="status-dot" style="background: ${promocode.status === 'active' ? 'var(--win)' : 'var(--loss)'}"></span>
                <span>${promocode.status === 'active' ? 'Активен' : 'Не работает'}</span>
              </div>
              <div class="promocode-source">Источник: ${esc(promocode.source)}</div>
              <div class="promocode-date">Дата проверки: ${esc(promocode.date)}</div>
            </div>
          `;
        }).join('');
      })
      .catch(error => {
        console.error('Ошибка загрузки промокодов:', error);
        document.getElementById('promocodes-list').innerHTML = '<p class="muted">Ошибка загрузки промокодов. Попробуйте позже.</p>';
      });
  </script>
</body>
</html>
